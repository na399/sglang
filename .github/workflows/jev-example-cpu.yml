name: Jev example CPU contracts

on:
  pull_request:
    paths:
      - 'examples/jev/**'
      - '.github/workflows/jev-example-cpu.yml'

permissions:
  contents: read

concurrency:
  group: jev-example-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      JEV_LIVE: '0'
      PYTHONASYNCIODEBUG: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU-only example dependencies
        run: python -m pip install --disable-pip-version-check -e 'examples/jev[test]'
      - name: Test example without model downloads or GPU access
        run: python -W error::RuntimeWarning -m pytest -q -c examples/jev/pyproject.toml examples/jev/tests
      - name: Check source compilation and schema command
        run: |
          python -m compileall -q examples/jev/sglang_jev examples/jev/tests
          python -m sglang_jev schema > /tmp/jev-request.schema.json
